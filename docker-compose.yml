version: "3.8"

services:
  quantumshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantumshield-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - qs-data:/app/prisma
      - qs-repos:/app/cloned-repositories

volumes:
  qs-data:
    driver: local
  qs-repos:
    driver: local
