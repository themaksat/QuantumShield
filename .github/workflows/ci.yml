name: QuantumShield CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Build, Lint & Multi-Stage Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: Initialize SQLite Schema
        run: npx prisma db push --skip-generate

      - name: TypeScript Type Safety Check
        run: npx tsc --noEmit

      - name: Run Cryptographic Engine Verification Suite
        run: npm test

      - name: Next.js Production Build
        run: npm run build

      - name: Run Full System Verification Audit
        run: |
          # Start background server
          npx next start -p 3000 &
          sleep 5
          # Run audit verification
          npx tsx src/scripts/full-system-audit.ts
